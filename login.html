<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="view-transition" content="same-origin">
<title>ВЫСЬ — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1efe9;--beige:#dbd8d1;--wine:#460203;--ink:#2d2b29;--gold:#b98c4f;--line:#c7c2b8;--blue:#567d9d;--green:#5b7a5e}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
h1,h2{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.02em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none}

.wrap{width:100%;max-width:420px}
.logo{display:block;text-align:center;color:var(--wine);font-size:30px;font-weight:700;margin-bottom:36px}
.card{background:#fff;border-radius:16px;padding:40px 36px}
.card h1{font-size:28px;text-align:center}
.card p.sub{text-align:center;font-size:14px;color:#8a8378;margin-top:10px;line-height:1.5}

form{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#5c574f;margin-bottom:7px}
.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:13px 15px;font-size:15px;font:inherit;color:var(--ink);background:#fff}
.field input:focus{outline:none;border-color:var(--wine)}

.remember-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.remember-row label{display:flex;align-items:center;gap:8px;color:#5c574f;cursor:pointer}
.remember-row input{accent-color:var(--wine);width:15px;height:15px}
.remember-row a{color:var(--wine);font-weight:700}

.btn-primary{background:var(--wine);color:#fff;padding:14px;border-radius:9px;font-size:15px;font-weight:700;margin-top:6px;transition:.15s}
.btn-primary:hover{background:#5c0304}

.switch-row{text-align:center;margin-top:24px;font-size:13.5px;color:#8a8378}
.switch-row a{color:var(--wine);font-weight:700;border-bottom:1px solid var(--wine);padding-bottom:1px}

.back-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:26px;font-size:13px;color:#8a8378;font-weight:600}

.msg{text-align:center;margin-top:16px;font-size:13.5px;color:var(--green);font-weight:700;min-height:18px}
.forgot-note{text-align:center;margin-top:14px;font-size:12.5px;color:#8a8378;display:none}
.forgot-note.show{display:block}
</style>
</head>
<body>

<div class="wrap">
  <a class="logo" href="index.html">ВЫСЬ</a>
  <div class="card">
    <h1>С возвращением</h1>
    <p class="sub">Введите данные, чтобы продолжить обучение.</p>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input required type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input required type="password" id="login-password" placeholder="Введите пароль">
      </div>
      <div class="remember-row">
        <label><input type="checkbox" checked> Запомнить меня</label>
        <a href="#" onclick="event.preventDefault();showForgot()">Забыли пароль?</a>
      </div>
      <button class="btn-primary">Войти</button>
      <p class="msg" id="login-msg"></p>
      <p class="forgot-note" id="forgot-note">Отправим ссылку для сброса пароля на почту — этот сценарий пока в разработке.</p>
    </form>

    <div class="switch-row">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
  </div>
  <a class="back-link" href="index.html">← Вернуться на сайт</a>
</div>

<script>
function showForgot(){
  document.getElementById('forgot-note').classList.add('show');
}
function handleLogin(event){
  event.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.textContent = 'Входим…';

  // На этом этапе роль определяется по аккаунту, а не вводится пользователем.
  // Пока нет настоящей базы данных — берём роль, сохранённую при регистрации в этом браузере.
  let role = 'student';
  try{
    role = localStorage.getItem('vys-account-role') || 'student';
  }catch(e){}

  setTimeout(()=>{
    if(role === 'teacher'){
      window.location.href = 'teacher-dashboard.html';
    } else {
      window.location.href = 'dashboard.html';
    }
  }, 450);
  return false;
}
</script>

</body>
</html>
